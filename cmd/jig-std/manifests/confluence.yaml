config:
  url: {type: string, description: "https://your-org.atlassian.net/wiki"}
  user: {type: string}
  token: {type: string, secret: true}
  space: {type: string, description: "space keys, comma-separated (PROD, SWIT); new pages go to the first"}
permissions: {secrets: [CONFLUENCE_TOKEN, ATLASSIAN_TOKEN]}
views:
  Confluence:
    slot: tab
    tabs:
      Pages: {widget: table, source: confluence.docs.pages, refresh: 5m, columns: {title: {width: 80}}}
      Recent: {widget: table, source: confluence.docs.search, args: {query: ""}, refresh: 60s}
