# A declarative plugin: one tab of terminal panes, no code jig runs. Copy it to start your own.
name: arcade
version: 1.1.0
description: a Games tab of terminal panes (snake is plain bash; add your own games)
publisher: goxang
views:
  Games:
    slot: {tab: {key: G}}
    tabs:
      Snake: {widget: terminal, dir: ., command: "bash snake.sh"}
      Shell: {widget: terminal, keep: true}
