name: arcade
version: 1.2.0
description: a Games tab of terminal panes (snake and tic-tac-toe in bash)
publisher: goxang
views:
  Games:
    slot: {tab: {key: G}}
    tabs:
      Snake: {widget: terminal, dir: ., command: "bash snake.sh"}
      "Tic Tac Toe": {widget: terminal, dir: ., command: "bash tictactoe.sh"}
      Shell: {widget: terminal, keep: true}
