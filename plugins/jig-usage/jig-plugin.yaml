name: jig-usage
version: 1.1.0
description: ":usage — CPU and memory of jig and each plugin it runs, refreshed every 2 seconds"
publisher: goxang
permissions: {exec: [jig-std, ps], env: ["*"]}
sources:
  usage: {run: jig-std tool usage, format: ndjson, cache: 1s}
views:
  Usage:
    slot: {command: usage}
    widget: table
    source: jig-usage.usage
    refresh: 2s
