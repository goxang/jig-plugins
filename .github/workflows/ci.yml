name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/goxang

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # goxang/jig is private while pre-1.0; GOXANG_READ_TOKEN is a read-only token for it
      - run: git config --global url."https://x-access-token:${{ secrets.GOXANG_READ_TOKEN }}@github.com/goxang/".insteadOf "https://github.com/goxang/"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test -race ./...
